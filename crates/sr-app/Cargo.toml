[package]
name = "sr-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sandbox-reactions"
path = "src/main.rs"

[dependencies]
sr-engine = { path = "../sr-engine" }
eframe.workspace = true
wgpu.workspace = true
serde_json.workspace = true

# The scripted captures (capture.rs, M0-T8): the desktop build only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png.workspace = true

# The web entry (web.rs, M0-T7): the wasm32 build only (§1.2).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "DomStringMap"] }
console_error_panic_hook.workspace = true
log.workspace = true
